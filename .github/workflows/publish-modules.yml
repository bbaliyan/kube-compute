name: Publish modules (OCI)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to (re-)publish"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # One OCI artifact for the whole modules/ tree per release, not one per
      # provider module: spine-*/worker-pool-* reference the shared cloud-init
      # module via a relative path (source = "../cloud-init"), which only
      # resolves if both are extracted from the same package (see OpenTofu's
      # OCI module docs on package-relative sources). Consumers address a
      # specific module the same way they already do with the git source,
      # via a "//modules/<name>" suffix.
      - name: Package modules/ tree
        run: git archive --format=zip --output=module-package.zip HEAD -- modules README.md NOTICE LICENSE

      - uses: oras-project/setup-oras@v1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push OCI module package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          oras push \
            --artifact-type application/vnd.opentofu.modulepkg \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.description=OpenTofu modules for the kube-compute compute layer (spine-*, worker-pool-*, cloud-init)" \
            --annotation "org.opencontainers.image.licenses=Apache-2.0" \
            "ghcr.io/${{ github.repository }}:${TAG}" \
            module-package.zip:archive/zip
