# Setup only. Every check lives in the Makefile; scripts/pipeline-lint.sh in
# make test-commit fails this file if it ever runs one.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TF_PLUGIN_CACHE_DIR: /tmp/tofu-plugins

jobs:
  commit:
    runs-on: ubuntu-latest
    container: ghcr.io/bbaliyan/kube-devenv:0.15.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Only main saves the cache, so a pull request cannot replace or evict what
      # main restores. A pull request that changes a lock file runs cold.
      # No restore-keys: tofu never prunes the directory, so a partial restore
      # would carry every old provider version forward.
      - id: plugins
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-plugins-${{ hashFiles('**/.terraform.lock.hcl') }}
      - run: make test-commit BASE_REF=${{ github.event.pull_request.base.sha || github.event.before }}
      - if: github.ref == 'refs/heads/main' && steps.plugins.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ steps.plugins.outputs.cache-primary-key }}

  integration:
    needs: commit
    runs-on: ubuntu-latest
    container: ghcr.io/bbaliyan/kube-devenv:0.15.0
    strategy:
      fail-fast: false
      matrix:
        provider: [proxmox, aws]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: make test-integration PROVIDERS=${{ matrix.provider }}
