name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tofu:
    runs-on: ubuntu-latest
    container: ghcr.io/bbaliyan/kube-devenv:0.8.11
    steps:
      - uses: actions/checkout@v7

      - name: Format check
        run: tofu fmt -check -recursive

      - name: Lint the baked node bootstrap program
        run: |
          # Baked into the node image and run by cloud-init, so a syntax error
          # here is a cluster that does not boot rather than a failed plan.
          bash -n modules/node-bootstrap/files/bootstrap.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S warning modules/node-bootstrap/files/bootstrap.sh
          else
            echo "shellcheck not in this image; syntax check only"
          fi

      - name: Validate and test each module
        run: |
          for d in modules/*/; do
            echo "== $d =="
            ( cd "$d" && tofu init -backend=false && tofu validate && tofu test )
          done

      - name: Trivy IaC scan
        run: |
          trivy config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignorefile .trivyignore \
            modules/

  # Builds each provider's registry mirror the way a release would, so a change
  # that breaks a release fails here rather than on the tag.
  split:
    runs-on: ubuntu-latest
    container: ghcr.io/bbaliyan/kube-devenv:0.8.11
    strategy:
      fail-fast: false
      matrix:
        provider: [proxmox, aws]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Build and validate the ${{ matrix.provider }} mirror
        run: |
          git init -q /tmp/split
          ./scripts/release-split.sh "${{ matrix.provider }}" /tmp/split "${GITHUB_WORKSPACE}"
          cd /tmp/split
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate
          tofu test
