# SPDX-License-Identifier: Apache-2.0
name: Release split

# Publishes each provider's slice of this repo to its read-only mirror,
# terraform-<provider>-kube-compute, which the OpenTofu Registry serves as
# bbaliyan/kube-compute/<provider>. scripts/release-split.sh builds the tree;
# a provider gets a release only when that tree differs from what its mirror
# already has, so a tag that touches only AWS modules releases only AWS.
#
# A mirror's tags are kube-compute's tags. Re-run a tag, or try one without
# pushing anything, from the Actions tab (workflow_dispatch). A re-run finishes
# whatever an interrupted release left undone, rather than starting a second one.
#
# SPLIT_REPO_PAT is a fine-grained token with contents: write on every mirror
# in the matrix below.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: kube-compute tag to release, e.g. v0.2.0
        required: true
      dry_run:
        description: Build and validate only; push nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    container: ghcr.io/bbaliyan/kube-devenv:0.8.15
    strategy:
      fail-fast: false
      matrix:
        provider: [proxmox, aws]
    env:
      PROVIDER: ${{ matrix.provider }}
      SPLIT_REPO: bbaliyan/terraform-${{ matrix.provider }}-kube-compute
      TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global --add safe.directory '*'
          git config --global user.name "Bharat Baliyan"
          git config --global user.email "bharat.baliyan19@gmail.com"

      - name: Check the tag
        run: |
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'${TAG}' is not vX.Y.Z"; exit 1; }

      - name: Checkout kube-compute at the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Checkout the mirror
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SPLIT_REPO }}
          token: ${{ secrets.SPLIT_REPO_PAT }}
          path: split-repo
          fetch-depth: 0

      - name: Build the release tree
        run: ./scripts/release-split.sh "${PROVIDER}" "${GITHUB_WORKSPACE}/split-repo" "${GITHUB_WORKSPACE}"

      # On a copy, so tofu init can't add anything (a lock file hash for this
      # platform, say) to what gets committed.
      - name: Validate the release tree
        run: |
          rm -rf /tmp/validate && cp -r split-repo /tmp/validate && cd /tmp/validate
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate
          tofu test

      - name: Compare with the mirror
        id: compare
        working-directory: split-repo
        run: |
          git add -A
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then tagged=true; else tagged=false; fi
          # The mirror's newest release before this one, for the notes. Its own tag doesn't count,
          # which it carries already on a re-run.
          echo "baseline=$(git tag -l 'v*.*.*' | grep -vFx "${TAG}" | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            if "${tagged}"; then
              # The push went through on an earlier run; see that its release did too.
              echo "${SPLIT_REPO} already has ${TAG}; checking its release"
            else
              echo "${SPLIT_REPO} already has this tree -- nothing to release for ${PROVIDER}"
            fi
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "release=${tagged}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if "${tagged}"; then
            echo "::error::${SPLIT_REPO} already has ${TAG}, with a different tree. Release a new tag."
            exit 1
          fi
          git diff --cached --stat
          echo "push=true" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push
        if: steps.compare.outputs.push == 'true' && env.DRY_RUN != 'true'
        working-directory: split-repo
        run: |
          git commit -q -s -m "release: ${TAG}"
          git tag "${TAG}"
          # One push, so a failure never leaves the branch moved without its tag.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"

      - name: Create the GitHub release
        if: steps.compare.outputs.release == 'true' && env.DRY_RUN != 'true'
        env:
          SPLIT_REPO_PAT: ${{ secrets.SPLIT_REPO_PAT }}
          BASELINE: ${{ steps.compare.outputs.baseline }}
        run: |
          api() {
            curl -sS -o /tmp/response.json -w '%{http_code}' \
              --retry 5 --retry-all-errors --retry-delay 5 \
              -H "Authorization: Bearer ${SPLIT_REPO_PAT}" \
              -H "Accept: application/vnd.github+json" "$@"
          }

          if [[ "$(api "https://api.github.com/repos/${SPLIT_REPO}/releases/tags/${TAG}")" == "200" ]]; then
            echo "${SPLIT_REPO} already has a release for ${TAG}"
            exit 0
          fi

          mapfile -t paths < <(./scripts/release-split.sh --paths "${PROVIDER}")
          if [[ -n "${BASELINE}" ]] && git rev-parse -q --verify "refs/tags/${BASELINE}" >/dev/null; then
            notes="$(printf 'Changes since %s:\n\n' "${BASELINE}"; git log --oneline "${BASELINE}..${TAG}" -- "${paths[@]}")"
          else
            notes="First release of ${SPLIT_REPO} (${TAG})."
          fi

          jq -n --arg tag "${TAG}" --arg body "${notes}" '{tag_name: $tag, name: $tag, body: $body}' >/tmp/release.json
          code=$(api -X POST "https://api.github.com/repos/${SPLIT_REPO}/releases" -d @/tmp/release.json)
          # 422 is a retry that arrived after the release was made.
          if [[ "${code}" == "422" ]]; then
            code=$(api "https://api.github.com/repos/${SPLIT_REPO}/releases/tags/${TAG}")
            [[ "${code}" == "200" ]] && code=201
          fi
          if [[ "${code}" != "201" ]]; then
            echo "::error::the release for ${TAG} was not created (HTTP ${code})"
            cat /tmp/response.json
            exit 1
          fi
