# Setup only. The check lives in the Makefile (state-migration-ci).
name: State migration

on:
  pull_request:
    paths:
      - "modules/aws-*/**"
      - "modules/node-bootstrap/**"
      - "tests/state-migration/**"
      - "scripts/release-split.sh"
      - "Makefile"
      - ".github/workflows/state-migration.yml"
  push:
    branches: [main]

concurrency:
  group: state-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TF_PLUGIN_CACHE_DIR: /tmp/tofu-plugins

jobs:
  state-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The emulator runs inside this container, so no host network is needed.
    container: ghcr.io/bbaliyan/kube-devenv:0.13.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Restore only. The commit job in ci.yml saves this cache on main.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-plugins-${{ hashFiles('**/.terraform.lock.hcl') }}
      - run: make state-migration-ci
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state-migration-changes
          path: /tmp/state-migration/*/changes.txt
          if-no-files-found: ignore
