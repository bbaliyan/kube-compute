---
# SPDX-License-Identifier: Apache-2.0
# Reboot step — only meaningful when patch.yml reported os_patch_reboot_needed:
# true. The block below is also gated on it as a safety net against being
# called directly. Connection vars come from the caller's block, not repeated
# here. See ../../../../README.md for background.

- name: os-patch | reboot and verify recovery
  when: os_patch_reboot_needed | default(false)
  block:
    - name: os-patch | reboot the node and wait for it to come back (ssh)
      # ansible.builtin.reboot's reconnect-detection is built around SSH's
      # connect/disconnect semantics (its docs list ssh/paramiko/psrp/winrm as
      # supported) — the operator's ansible-playbook process stays alive
      # across the reboot and reconnects on its own. Verified live against
      # Proxmox (see ../../../../README.md).
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: ansible_connection == "ssh"

    # ---- Non-SSH transports (amazon.aws.aws_ssm today) ------------------------
    # ansible.builtin.reboot's reconnect loop doesn't reliably detect recovery
    # over the aws_ssm connection plugin: an SSM session doesn't close the way
    # an SSH connection does when the node reboots, so the module's internal
    # polling can outlive its own reboot_timeout without ever resolving —
    # confirmed live against cluster-1's AWS control-plane node (kube-claude
    # kube-devclusters-migration map): the instance rebooted and SSM reported
    # the agent back Online well inside the 600s window, but the reboot task
    # never noticed and the run hung indefinitely. Handled manually instead:
    # trigger the reboot without waiting for the module to observe it, force a
    # fresh connection, then poll a real boot marker (not just "can we
    # connect") until it changes — ignore_unreachable is required on the poll
    # task specifically because Ansible otherwise drops a host that goes
    # UNREACHABLE for the rest of the whole play, not just this task, which
    # would abort mid-reboot-window on the very first connection attempt that
    # catches the node still coming back up.
    - name: os-patch | capture the pre-reboot boot id (non-ssh)
      ansible.builtin.command: cat /proc/sys/kernel/random/boot_id
      register: os_patch_boot_id_before
      changed_when: false
      when: ansible_connection not in ["ssh", "local"]

    - name: os-patch | trigger the reboot without waiting for it (non-ssh)
      # Fire-and-forget: the connection dying mid-command is the expected,
      # desired outcome here, not a failure to react to.
      ansible.builtin.shell: sleep 2 && reboot
      async: 1
      poll: 0
      ignore_errors: true
      when: ansible_connection not in ["ssh", "local"]

    - name: os-patch | drop the now-stale connection (non-ssh)
      # Forces the next task to establish a brand new SSM session rather than
      # reusing a cached one that may still reference the pre-reboot instance.
      ansible.builtin.meta: reset_connection
      when: ansible_connection not in ["ssh", "local"]

    - name: os-patch | wait for the node to come back with a new boot id (non-ssh)
      ansible.builtin.command: cat /proc/sys/kernel/random/boot_id
      register: os_patch_boot_id_after
      until: >-
        os_patch_boot_id_after.stdout is defined and
        os_patch_boot_id_after.stdout != os_patch_boot_id_before.stdout
      retries: 60
      delay: 10
      ignore_unreachable: true
      changed_when: false
      when: ansible_connection not in ["ssh", "local"]

    - name: os-patch | wait for the node's RKE2 service to report active
      # Skipped when the caller doesn't supply os_patch_rke2_service —
      # node-bootstrap's own stage-0 call (this role's first-boot caller,
      # before RKE2 is even installed) has no service to wait on yet.
      ansible.builtin.command: "systemctl is-active {{ os_patch_rke2_service }}"
      register: os_patch_rke2_status
      until: os_patch_rke2_status.rc == 0
      retries: 30
      delay: 10
      # Don't fail the whole orchestrator run if RKE2 doesn't report active
      # within the wait window, just move on.
      failed_when: false
      changed_when: false
      when:
        - ansible_connection != "local"
        - os_patch_rke2_service is defined
        - os_patch_rke2_service | length > 0
