---
# SPDX-License-Identifier: Apache-2.0
# Runs `dnf update -y` on the target node over SSH — connection vars
# (ansible_connection/host/user/ssh_private_key_file/ssh_common_args) come
# from the caller's block, not repeated here. See ../../../../README.md for
# background. Never reboots by itself; sets os_patch_reboot_needed for the
# caller to act on separately via reboot.yml.

- name: os-patch | run dnf update -y on the node (retry + self-heal on lock contention)
  # Transient dnf/rpm lock contention from background processes is a real,
  # recurring condition on these nodes, not something to assume is fully
  # eliminated by disabling known culprits (PackageKit, dnf-makecache.timer)
  # at first boot alone. A non-zero exit after all retries fails this task
  # (and the play) using the shell module's own default failed_when plus its
  # captured stdout/stderr.
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for attempt in 1 2 3 4 5; do
        dnf update -y && exit 0
        [ "$attempt" -eq 5 ] && exit 1
        sleep 15
        pkill -x dnf 2>/dev/null || true
        pkill -x rpm 2>/dev/null || true
      done
  changed_when: true

- name: os-patch | check whether a reboot is needed
  ansible.builtin.command: dnf needs-restarting -r
  register: os_patch_reboot_check
  # dnf needs-restarting -r exits 1 when a reboot IS needed, 0 when it's
  # not — inverted from the usual success/fail convention, so this is
  # not a failure either way; the real signal is the exit code itself.
  failed_when: false
  changed_when: false

- name: os-patch | record whether a reboot is needed
  ansible.builtin.set_fact:
    os_patch_reboot_needed: "{{ os_patch_reboot_check.rc == 1 }}"
