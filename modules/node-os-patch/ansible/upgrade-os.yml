---
# SPDX-License-Identifier: Apache-2.0
# Cross-node OS-patch orchestrator (kube-claude wayfinder map #30, ticket #34 —
# generalized from kube-examples' original ops/upgrade-os.yml, kube-claude
# map #14 ticket #20).
#
# Takes node topology as extra-vars (this module's own outputs.tf computes
# them from control_plane_node_refs/worker_node_refs — ordinary Terraform
# module composition, no terragrunt/Terraform state read from inside Ansible).
#
# Registers each node as a real Ansible host via add_host (name = its
# control_plane_node_refs/worker_node_refs map key, e.g. "cluster-3-cp-0") in
# a discovery play, then drives the shared os_patch role against those named
# hosts in two further plays — deliberately NOT a single "hosts: localhost"
# play with per-task ansible_host/ansible_connection overrides (an earlier
# version of this playbook worked that way): Ansible always labels task
# output with the play's inventory_hostname, not the resolved ansible_host,
# so every node's output was indistinguishable, all printed as "[localhost]"
# — a real operator surfaced this running it live against cluster-3. Named
# hosts fix it: output reads "changed: [cluster-3-cp-0]",
# "changed: [cluster-3-worker-3]", etc.
#
# The one-CP-at-a-time invariant (etcd tolerates losing at most one
# control-plane node at once — kube-claude#16) comes from `serial: 1` on the
# control-plane play: Ansible runs the whole play (patch, then conditional
# reboot, then the wait-for-RKE2-healthy gate) against one host before moving
# to the next, so the next node's play never starts against a still-recovering
# cluster. No separate etcd-health check is needed on top of that.
#
# Workers use the same serial: 1 play for simplicity — safe to parallelize
# later (workers hold no quorum state) but not required for correctness.
#
# An all_in_one cluster shape (no separate worker pool) is the degenerate
# case: worker_node_refs is {} (this module's own default), so no hosts land
# in the worker_nodes group and Ansible skips that play entirely — same
# playbook, no special-casing.
#
# Usage: ansible-playbook <orchestrator_playbook_path> -e "$(tofu output -raw orchestrator_extra_vars_json)"

- name: Discover cluster nodes for the OS-patch orchestrator
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: assert required extra-vars were given
      ansible.builtin.assert:
        that:
          - control_plane_node_refs is defined
          - ansible_ssh_user is defined
          - ansible_ssh_private_key_file is defined
        fail_msg: >-
          Missing extra-vars — pass this module's own orchestrator_extra_vars_json
          output verbatim rather than assembling extra-vars by hand.

    - name: register each control-plane node as a real Ansible host
      ansible.builtin.add_host:
        name: "{{ item.key }}"
        groups: cp_nodes
        ansible_connection: ssh
        ansible_host: "{{ item.value.ip }}"
        ansible_user: "{{ ansible_ssh_user }}"
        ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file }}"
        # Disposable-cluster environment: the same IP can be reassigned to a
        # different node's host key over time (VM recreation). Matches
        # node-bootstrap's own connection vars exactly.
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null"
        ansible_become: true
        os_patch_rke2_service: "{{ rke2_server_service | default('rke2-server') }}"
      loop: "{{ control_plane_node_refs | dict2items }}"

    - name: register each worker node as a real Ansible host
      ansible.builtin.add_host:
        name: "{{ item.key }}"
        groups: worker_nodes
        ansible_connection: ssh
        ansible_host: "{{ item.value.ip }}"
        ansible_user: "{{ ansible_ssh_user }}"
        ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null"
        ansible_become: true
        os_patch_rke2_service: "{{ rke2_agent_service | default('rke2-agent') }}"
      loop: "{{ (worker_node_refs | default({})) | dict2items }}"

- name: Patch control-plane nodes one at a time
  hosts: cp_nodes
  gather_facts: false
  serial: 1

  tasks:
    - ansible.builtin.include_role:
        name: os_patch
        tasks_from: patch

    - ansible.builtin.include_role:
        name: os_patch
        tasks_from: reboot

- name: Patch worker nodes
  hosts: worker_nodes
  gather_facts: false
  serial: 1

  tasks:
    - ansible.builtin.include_role:
        name: os_patch
        tasks_from: patch

    - ansible.builtin.include_role:
        name: os_patch
        tasks_from: reboot
