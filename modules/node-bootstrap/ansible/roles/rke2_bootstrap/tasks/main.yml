---
# SPDX-License-Identifier: Apache-2.0
# GitOps/Argo CD bootstrap remains deferred — see this module's README.md
# "Scope of this build" (a distinct post-install step, ported separately).

- name: Read secrets from the control node's environment
  ansible.builtin.set_fact:
    resolved_cluster_token: "{{ lookup('env', 'CLUSTER_TOKEN') }}"
    resolved_cluster_agent_token: "{{ lookup('env', 'CLUSTER_AGENT_TOKEN') }}"
    resolved_agent_token_fetch_command: "{{ lookup('env', 'AGENT_TOKEN_FETCH_COMMAND') }}"
    resolved_trusted_ca_pem: "{{ lookup('env', 'TRUSTED_CA_PEM') }}"
  no_log: true

# ---- universal OS prep (all roles) ----

- name: os-prep | inotify limits (written early — sysctl.d is only read at next
    boot; applying now covers the current boot, matching cloud-init's ordering)
  ansible.builtin.copy:
    src: 99-rke2-inotify.conf
    dest: /etc/sysctl.d/99-rke2-inotify.conf
    mode: "0644"
  register: inotify_conf

- name: os-prep | apply inotify limits immediately
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-rke2-inotify.conf
  when: inotify_conf.changed

- name: os-prep | hot-added vCPU online rule (inert on AWS/Azure, needed on
    Proxmox/KVM guests)
  ansible.builtin.copy:
    src: 80-hotplug-cpu-online.rules
    dest: /etc/udev/rules.d/80-hotplug-cpu-online.rules
    mode: "0644"

- name: os-prep | install ca-certificates and curl, load br_netfilter/overlay
  ansible.builtin.shell: |
    set -euo pipefail
    dnf makecache
    dnf install -y ca-certificates curl
    # RHEL10-family kernels (6.12+, confirmed on AlmaLinux 10) dropped the
    # legacy br_netfilter module entirely — bridged traffic is filtered
    # natively via nftables' bridge-family hooks (nf_conntrack_bridge et al,
    # auto-loaded with the bridge module), so there's no module to load and
    # no bridge-nf-call-iptables/-ip6tables knob to set on those kernels.
    # RHEL9-family kernels still ship br_netfilter and need both.
    if modinfo br_netfilter >/dev/null 2>&1; then
      printf 'br_netfilter\noverlay\n' >/etc/modules-load.d/rke2.conf
      modprobe br_netfilter
    else
      printf 'overlay\n' >/etc/modules-load.d/rke2.conf
    fi
    modprobe overlay
    printf 'net.ipv4.ip_forward = 1\n' >/etc/sysctl.d/98-rke2-bridge.conf
    if [ -d /proc/sys/net/bridge ]; then
      printf 'net.bridge.bridge-nf-call-iptables = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\n' >>/etc/sysctl.d/98-rke2-bridge.conf
    fi
    sysctl --system
  args:
    creates: /etc/modules-load.d/rke2.conf

- name: os-trust | add trusted CA to the OS trust store
  ansible.builtin.copy:
    content: "{{ resolved_trusted_ca_pem }}"
    dest: /etc/pki/ca-trust/source/anchors/trusted-ca.crt
    mode: "0644"
  when: resolved_trusted_ca_pem | length > 0
  no_log: true

- name: os-trust | update-ca-trust extract
  ansible.builtin.command: update-ca-trust extract
  when: resolved_trusted_ca_pem | length > 0

- name: registry-mirror | preflight check the mirror is reachable
  ansible.builtin.uri:
    url: "{{ registry_mirror_url }}/v2/"
    status_code: [200, 401]
  when: registry_mirror_url | length > 0

- name: registry-mirror | render registries.yaml
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/rke2/registries.yaml
    mode: "0644"
  when: registry_mirror_url | length > 0

- name: selinux-prep | quiesce packagekit (holds the rpm lock intermittently)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - packagekit
    - packagekit.socket
  failed_when: false

- name: selinux-prep | add the rancher-rke2-common repo
  ansible.builtin.yum_repository:
    name: rancher-rke2-common-stable
    description: Rancher RKE2 Common (stable)
    baseurl: https://rpm.rancher.io/rke2/stable/common/centos/9/noarch
    enabled: true
    gpgcheck: true
    gpgkey: https://rpm.rancher.io/public.key

- name: selinux-prep | import the Rancher GPG key (retry — transient failures)
  ansible.builtin.rpm_key:
    key: https://rpm.rancher.io/public.key
    state: present
  register: gpg_import
  retries: 3
  delay: 10
  until: gpg_import is succeeded

- name: selinux-prep | install rke2-selinux (retry + self-heal on lock contention)
  # No `creates:` idempotency guard here (unlike the os-prep task above) —
  # this project could not verify a stable marker file rke2-selinux always
  # writes. `dnf install -y` on an already-installed package is itself a fast
  # no-op, so this is safe to re-run every time, just not skip-reported.
  ansible.builtin.shell: |
    set -euo pipefail
    dnf makecache
    for attempt in 1 2 3 4 5; do
      dnf install -y rke2-selinux && exit 0
      [ "$attempt" -eq 5 ] && exit 1
      sleep 15
      pkill -x dnf 2>/dev/null || true
      pkill -x rpm 2>/dev/null || true
    done
  changed_when: true

- name: Ensure /etc/rancher/rke2 exists
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"

# ---- server-init: genesis, with rejoin-detection ----
# RKE2 has no --cluster-init flag: the first server is simply the one whose
# config.yaml has no "server:" key. A replaced genesis node must instead
# rejoin an already-healthy cluster (registration_address reachable) rather
# than blindly re-initializing etcd, which would split-brain a live quorum.
- name: server-init | probe registration endpoint for rejoin detection
  ansible.builtin.uri:
    url: "https://{{ registration_address }}:6443/readyz"
    validate_certs: false
    status_code: [200, 401, 403, -1]
  register: rejoin_probe
  failed_when: false
  when:
    - node_role == "server-init"
    - registration_address | length > 0

- name: server-init | set server_line when a healthy cluster was detected
  ansible.builtin.set_fact:
    server_line: >-
      {{ ("server: https://" + registration_address + ":9345")
         if (node_role == "server-init" and registration_address | length > 0
             and rejoin_probe is defined and rejoin_probe.status is defined
             and rejoin_probe.status in [200, 401, 403])
         else "" }}
  when: node_role == "server-init"

- name: server-join | server_line is unconditional (always joining an existing cluster)
  ansible.builtin.set_fact:
    server_line: "server: https://{{ registration_address }}:9345"
  when: node_role == "server-join"

- name: server-init/server-join | render config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
  when: node_role in ["server-init", "server-join"]

# ---- auto-deploy manifests: must exist before RKE2's first start, since RKE2
#      only auto-applies whatever it finds under server/manifests/ at startup ----
- name: server-init/server-join | ensure the server manifests directory exists
  ansible.builtin.file:
    path: /var/lib/rancher/rke2/server/manifests
    state: directory
    mode: "0700"
  when: node_role in ["server-init", "server-join"]

# Genesis-only (Ticket 04): Cilium is a cluster-wide DaemonSet/Deployment,
# not per-node state — a joining server doesn't need it re-applied, it just
# needs the cluster to already have it. Rendered via `helm template` — never
# RKE2's HelmChart CRD (Ticket 01): a HelmChart CR's finalizer runs
# `helm uninstall` on deletion with no supported way to avoid it, which would
# fight (and later block handing off to) Argo CD-native management.
#
# The actual `helm template` render happens in node-bootstrap's own main.tf,
# in the shell script that invokes ansible-playbook — not here as a
# `delegate_to: localhost` task. That was tried first and failed: this
# module's own extra-vars set ansible_connection/ansible_host as plain
# (non-host-scoped) vars, and Ansible's extra-vars ALWAYS win over even
# task-level `vars:` overrides (documented precedence), so `delegate_to:
# localhost` silently resolved back to the target node instead of the
# control machine and failed with "helm: not found" there — confirmed via a
# real cluster-1 apply. `helm template` needs no cluster/network access at
# all (pure local rendering from chart + values), so rendering it in the
# wrapping shell script — unambiguously the operator machine — sidesteps
# Ansible's connection model entirely; this task's only job is a plain copy
# of the already-rendered file, which `copy` always reads from the control
# machine regardless of connection settings. See Tickets 01/05/06 of
# .scratch/cilium-argocd-gitops-handoff/map.md in the kube-claude repo.
- name: server-init | write the rendered Cilium manifest
  ansible.builtin.copy:
    src: "/tmp/kube-compute-cilium-manifest-{{ node_name }}.yaml"
    dest: /var/lib/rancher/rke2/server/manifests/cilium.yaml
    mode: "0600"
  when: node_role == "server-init" and cni == "cilium"

- name: server-init/server-join | write extra server manifests
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "/var/lib/rancher/rke2/server/manifests/{{ item.key }}"
    mode: "0600"
  loop: "{{ extra_server_manifests | dict2items }}"
  when: node_role in ["server-init", "server-join"]

- name: server-init/server-join | install RKE2
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL https://get.rke2.io | sh -
  args:
    creates: /usr/local/bin/rke2-uninstall.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ k8s_version }}"
  when: node_role in ["server-init", "server-join"]

- name: server-init | enable and start rke2-server
  ansible.builtin.systemd:
    name: rke2-server
    enabled: true
    state: started
  when: node_role == "server-init"

# Additional control-plane nodes join RKE2's embedded-etcd cluster one at a
# time: an upstream etcd limitation (only one non-voting "learner" member
# allowed at a time — https://etcd.io/docs/v3.4/learning/design-learner/),
# not a K3s-only quirk (rancher/rke2#3562, #4035, #349). This staggers by the
# node's own index (parsed from node_name's numeric suffix) and self-heals by
# wiping local server state and retrying if a collision still slips through —
# reproducing cloud-init's proven mechanics one-for-one.
- name: server-join | staggered, self-healing join
  ansible.builtin.shell: |
    set -euo pipefail
    NODE_INDEX="$(echo '{{ node_name }}' | grep -oE '[0-9]+$' || echo 0)"
    sleep $((NODE_INDEX * 60))

    systemctl enable rke2-server.service
    JOIN_ATTEMPT=0
    until systemctl start rke2-server.service && timeout 90 bash -c 'until /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes --no-headers 2>/dev/null | grep -q " Ready"; do sleep 5; done'; do
      JOIN_ATTEMPT=$((JOIN_ATTEMPT + 1))
      [ "$JOIN_ATTEMPT" -ge 3 ] && { echo "join-race exhausted after 3 attempts" >&2; exit 1; }
      systemctl stop rke2-server 2>/dev/null || true
      rm -rf /var/lib/rancher/rke2/server/tls /var/lib/rancher/rke2/server/cred /var/lib/rancher/rke2/server/db
      sleep 15
    done
  when: node_role == "server-join"

# ---- worker: fetch its own agent token, install as agent ----
- name: worker | fetch agent token from the provider's secret store
  ansible.builtin.command: "{{ resolved_agent_token_fetch_command }}"
  register: agent_token_result
  no_log: true
  when: node_role == "worker"

- name: worker | set resolved_agent_token
  ansible.builtin.set_fact:
    resolved_agent_token: "{{ agent_token_result.stdout }}"
  no_log: true
  when: node_role == "worker"

- name: worker | fail fast on an empty fetched token
  ansible.builtin.fail:
    msg: "agent_token_fetch_command produced an empty token"
  when: node_role == "worker" and (resolved_agent_token | default('')) | length == 0

- name: worker | render config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/rke2/config.yaml
    mode: "0600"
  when: node_role == "worker"

- name: worker | install RKE2 agent
  ansible.builtin.shell: |
    set -euo pipefail
    curl -sfL https://get.rke2.io | sh -
  args:
    creates: /usr/local/bin/rke2-uninstall.sh
  environment:
    INSTALL_RKE2_VERSION: "{{ k8s_version }}"
    INSTALL_RKE2_TYPE: "agent"
  when: node_role == "worker"

- name: worker | enable and start rke2-agent
  ansible.builtin.systemd:
    name: rke2-agent
    enabled: true
    state: started
  when: node_role == "worker"

# ---- wait for readiness, so Ansible's own synchronous output (this project's
#      primary live-visibility mechanism per Ticket 02) reflects real success/
#      failure rather than "service started" alone ----
- name: server-init/server-join | wait for this node to report Ready
  ansible.builtin.shell: |
    set -euo pipefail
    /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get node "$(hostname)" --no-headers 2>/dev/null | awk '{print $2}' | grep -q Ready
  register: ready_check
  until: ready_check.rc == 0
  retries: 60
  delay: 5
  changed_when: false
  when: node_role in ["server-init", "server-join"]

- name: worker | wait for rke2-agent to be active
  ansible.builtin.systemd:
    name: rke2-agent
  register: agent_status
  until: agent_status.status.ActiveState == "active"
  retries: 60
  delay: 5
  when: node_role == "worker"

# ---- GitOps/Argo CD bootstrap: server-init only, after the node is Ready ----
- name: gitops | ensure the manifests directory exists
  ansible.builtin.file:
    path: /etc/kube-compute/manifests
    state: directory
    mode: "0755"
  when: node_role == "server-init" and gitops_platform_repo_url | length > 0

# Rendered via `helm template` in node-bootstrap's own main.tf (the shell
# script that invokes ansible-playbook), not a `delegate_to: localhost` task
# here — same reasoning and the same real bug found via a `cluster-1` apply
# as Cilium's genesis install above. Genesis only needs *a* working pinned
# Argo CD version, not the consumer's target version (Ticket 02): Argo CD
# upgrading itself in place is ordinary, low-risk operation, unlike a CNI
# swap — so kube-platform's own self-managing Application is what carries
# the consumer's chosen version going forward, not this genesis step. See
# Tickets 01/02/05/06 of .scratch/cilium-argocd-gitops-handoff/map.md in the
# kube-claude repo.
- name: gitops | write the rendered Argo CD manifest (Namespace + chart)
  ansible.builtin.copy:
    src: "/tmp/kube-compute-argocd-manifest-{{ node_name }}.yaml"
    dest: /etc/kube-compute/manifests/00-argocd.yaml
    mode: "0644"
  when: node_role == "server-init" and gitops_platform_repo_url | length > 0

- name: gitops | render the platform Application manifest
  ansible.builtin.template:
    src: platform-app.yaml.j2
    dest: /etc/kube-compute/manifests/10-platform-app.yaml
    mode: "0644"
  when: node_role == "server-init" and gitops_platform_repo_url | length > 0
  no_log: true

- name: gitops | apply the Argo CD manifest
  # --server-side is required, not stylistic: a plain (client-side) apply
  # stores the whole previous config in a last-applied-configuration
  # annotation for 3-way merging, and Argo CD's own applicationsets.argoproj.io
  # CRD is large enough to exceed Kubernetes' 262144-byte annotation-size
  # limit — confirmed via a real cluster-1 apply ("metadata.annotations: Too
  # long"). Server-side apply uses field-manager metadata instead of that
  # annotation, sidestepping the limit entirely — the same mechanism this
  # project already relies on for kube-platform's own Applications
  # (ServerSideApply=true), just invoked via kubectl's own flag here.
  ansible.builtin.command: >-
    /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
    apply --server-side -f /etc/kube-compute/manifests/00-argocd.yaml
  when: node_role == "server-init" and gitops_platform_repo_url | length > 0

- name: gitops | wait for argocd-server to be ready
  ansible.builtin.command: >-
    /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
    -n argocd rollout status deployment/argocd-server --timeout=30s
  register: argocd_rollout
  until: argocd_rollout.rc == 0
  retries: 40
  delay: 15
  changed_when: false
  when: node_role == "server-init" and gitops_platform_repo_url | length > 0

- name: gitops | apply the platform Application manifest
  ansible.builtin.command: >-
    /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
    apply -f /etc/kube-compute/manifests/10-platform-app.yaml
  when: node_role == "server-init" and gitops_platform_repo_url | length > 0
