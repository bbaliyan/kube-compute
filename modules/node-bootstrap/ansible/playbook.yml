# SPDX-License-Identifier: Apache-2.0
- name: RKE2 node bootstrap (AlmaLinux 10)
  hosts: all
  # Ansible's implicit fact-gathering runs before pre_tasks, not after —
  # despite what the previous version of this comment claimed. Terraform
  # triggers this play the moment the VM resource is created, which is the
  # provider API call returning, not the guest OS having finished booting far
  # enough for sshd to accept connections: with gather_facts: true, that
  # implicit "Gathering Facts" task is the very first connection attempt and
  # can race a still-booting VM, failing hard with "Connection refused" and
  # no retry — the wait_for_connection pre_task below never got a chance to
  # run first. Disabling implicit gathering and gathering explicitly as a
  # pre_task, after the wait, is what actually orders it correctly.
  gather_facts: false
  become: true
  pre_tasks:
    - name: wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300
    - name: gather facts
      ansible.builtin.setup:
  roles:
    - rke2_bootstrap
