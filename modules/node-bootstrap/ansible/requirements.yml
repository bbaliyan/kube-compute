---
# Ansible collections this module's connection plugins need. Installed by
# node-bootstrap's own local-exec command before ansible-playbook runs —
# not baked into kube-devenv, which ships ansible-core only.
collections:
  - name: amazon.aws
    version: "11.4.0"
  # timer/profile_tasks callback plugins (enabled via kube-devenv's kube-apply
  # exporting ANSIBLE_CALLBACKS_ENABLED) live here, not in ansible-core.
  - name: ansible.posix
    version: "2.2.2"
